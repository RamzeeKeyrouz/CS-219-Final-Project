<!DOCTYPE html>

<html>

<head>
    <form action="create_account.html" method="post">

    <div>
        Full Name
    </div>
    <div>
        <input type="text" placeholder="Bob Smith" id="createAccountFullName" required>
    </div>

    <div>
        Email Adress
    </div>
    <div>
        <input type = "email" placeholder = "bob@example.com" id="createAccountEmail" required>
    </div>

    <div>
        Password
    </div>
    <div>
        <input type = "password" placeholder = "At least 12 characters" id="createAccountPassword" required>
    </div>

    <button type="submit">Create Account</button>

    </form>

    <body>
        Already have an account? <a href="sign_in.html">Sign In</a>
    </body>
</head>

<script>
    const form = document.querySelector("form");

    const fullName = document.getElementById("createAccountFullName");
    const email = document.getElementById("createAccountEmail");
    const password = document.getElementById("createAccountPassword");
    const errorMessage = document.getElementById("errorMessage");

    form.addEventListener("submit", function (event) {

        errorMessage.textContent = "";

        if (
            fullName.value.trim() === "" ||
            email.value.trim() === "" ||
                password.value.trim() === ""
            ) {
                event.preventDefault();
                errorMessage.textContent = "Please fill in all fields.";
                return;
            }
        });
    </script>
</body>

</html>

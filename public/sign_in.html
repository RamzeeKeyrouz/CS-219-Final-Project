<!DOCTYPE html>
<html>
<head>
    <form action = "sign_in.html" method = "post">
    <div>
        Email Address
    </div>
    <div>
    <input type = "text" placeholder = "bob@example.com" id="signInUsername">
    </div>

    <div>
        Password <a href="reset_password.html">Forgot password?</a>
    </div>
    <div>
    <input type = "password" placeholder = "At least 6 characters" id="signInPassword">
    </div>
<div>
    <p id="errorMessage"></p>
</div>
    <button type = "submit">Sign In</button>

    </form>

    </head>

    <body>
    Dont have an account?<a href="create_account.html">Create Account</a>
    </body>
    <script>
        const form = document.querySelector("form");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("signInUsername").value;
    const password = document.getElementById("signInPassword").value;

    try {

        const response = await fetch("/api/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const result = await response.json();

        if (!response.ok) {
            document.getElementById("errorMessage").textContent =
                result.message;
            return;
        }

        window.location.href = result.redirect;

        //make sure all text boxes are filled in
        if (
            email.value.trim() === "" ||
            password.value.trim() === ""
            ) {
            event.preventDefault();
            errorMessage.textContent = "Please fill in all boxes.";
            }
        else {
            event.preventDefault();
            errorMessage.textContent = "Conditions are met.";
            location.href = 'dashboard.html';
        }
    } catch (error) {

        document.getElementById("errorMessage").textContent =
            "Unable to connect to server.";

    }

});
    </script>


</html>

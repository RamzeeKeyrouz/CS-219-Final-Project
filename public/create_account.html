<!DOCTYPE html>

<html>

<head>
    <form action="create_account.html" method="post">

    <div>
        Full Name
    </div>
    <div>
        <input type="text" placeholder="Bob Smith" id="createAccountFullName">
    </div>

    <div>
        Email Adress
    </div>
    <div>
        <input type = "text" placeholder = "bob@example.com" id="createAccountEmail">
    </div>

    <div>
        Password
    </div>
    <div>
        <input type = "password" placeholder = "At least 6 characters" id="createAccountPassword">
    </div>

    <button type="submit" onclick="location.href = 'dashboard.html'">Create Account</button>

    <p id="errorMessage"></p>

    </form>

    <body>
        Already have an account? <a href="sign_in.html">Sign In</a>
    </body>
</head>

<script>
    
const form = document.querySelector("form");

const fullName = document.getElementById("createAccountFullName");
const email = document.getElementById("createAccountEmail");
const password = document.getElementById("createAccountPassword");
const errorMessage = document.getElementById("errorMessage");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    errorMessage.textContent = "";

    // Send account information to Node.js
    try {

        const response = await fetch("/api/register", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                fullName: fullName.value.trim(),
                email: email.value.trim(),
                password: password.value
            })
        });

        const result = await response.json();

        if (!response.ok) {
            errorMessage.textContent = result.message;
            return;
        }

        // Account successfully created
        window.location.href = "sign_in.html";

    } catch (error) {

        errorMessage.textContent =
            "Unable to connect to the server.";

        console.error(error);
    }

            event.preventDefault();
            location.href = 'dashboard.html';
        }

});

    </script>
</body>

</html>

<!DOCTYPE html>

<html>

<head>
    <form action="create_account.html" method="post">

    <div>
        Full Name
    </div>
    <div>
        <input type="text" placeholder="Bob Smith" id="createAccountFullName">
    </div>

    <div>
        Email Adress
    </div>
    <div>
        <input type = "text" placeholder = "bob@example.com" id="createAccountEmail">
    </div>

    <div>
        Password
    </div>
    <div>
        <input type = "password" placeholder = "At least 6 characters" id="createAccountPassword">
    </div>

    <button type="submit" onclick="location.href = 'dashboard.html'">Create Account</button>

    <p id="errorMessage"></p>

    </form>

    <body>
        Already have an account? <a href="sign_in.html">Sign In</a>
    </body>
</head>

<script>
    const form = document.querySelector("form");

    const fullName = document.getElementById("createAccountFullName");
    const email = document.getElementById("createAccountEmail");
    const password = document.getElementById("createAccountPassword");
    const errorMessage = document.getElementById("errorMessage");

    form.addEventListener("submit", function (event) {

        //make sure all text boxes are filled in
        if (
            fullName.value.trim() === "" ||
            email.value.trim() === "" ||
            password.value.trim() === ""
            ) {
                event.preventDefault();
                errorMessage.textContent = "Please fill in all boxes.";
                return;
            }

        //validate email
        const emailPattern = /^[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]+$/;

        if (!emailPattern.test(email.value.trim())) {
            event.preventDefault();
            errorMessage.textContent = "Please enter a valid email address.";
            return;
        }

        //validate password length
        if (password.value.trim().length < 6) {
            event.preventDefault();
            errorMessage.textContent = "Password must be at least 6 characters long.";
            return;
        }
        
        // If all of the validations pass, then it will go to the dashboard page
        if (emailPattern.test(email.value.trim()) && password.value.trim().length >= 6){
            event.preventDefault();
            location.href = 'dashboard.html';
        }

        });

    </script>
</body>

</html>

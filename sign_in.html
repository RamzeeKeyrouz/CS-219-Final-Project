<!DOCTYPE html>
<html>
<head>
    <form action = "sign_in.html" method = "post">
    <div>
        Email Address
    </div>
    <div>
    <input type = "text" placeholder = "bob@example.com" id="signInUsername">
    </div>

    <div>
        Password <a href="reset_password.html">Forgot password?</a>
    </div>
    <div>
    <input type = "password" placeholder = "At least 6 characters" id="signInPassword">
    </div>
<div>
    <p id="errorMessage"></p>
</div>
    <button type = "submit" >Sign In</button>

    </form>

    </head>

    <body>
    Dont have an account?<a href="create_account.html">Create Account</a>
    </body>
    <script>
        const form = document.querySelector("form");

        const email =document.getElementById("signInUsername");
        const password = document.getElementById("signInPassword");
        const errorMessage = document.getElementById("errorMessage");

        form.addEventListener("submit", function (event) {

        //make sure email is valid
        const emailPattern = /^[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]+$/;

        if (!emailPattern.test(email.value.trim())) {
            event.preventDefault();
            errorMessage.textContent = "Please enter a valid email address.";
            return;
        }

        //make sure password is at least 6 characters long
        if (password.value.length < 6) {
            event.preventDefault();
            errorMessage.textContent = "Password must be at least 6 characters long.";
            }

        //make sure all text boxes are filled in
        if (
            email.value.trim() === "" ||
            password.value.trim() === ""
            ) {
            event.preventDefault();
            errorMessage.textContent = "Please fill in all boxes.";
            }

        });
    
    </script>


</html>
